openapi: 3.0.3
info:
  title: Orion POS API
  version: 0.1.0
  description: |
    The contract between the Orion backend and its clients (back office, POS, admin console).
    It is the source of truth: Go types and server stubs are generated from it (`make gen`), and
    CI fails if the generated code is out of date.

    Conventions (docs/BACKEND_PLAN.md section 4.10):

    - Errors are `application/problem+json` with a stable `code`. Clients switch on `code`, never
      on `title` or `detail`.
    - JSON field names are snake_case. Timestamps are RFC 3339 in UTC. Money is integer rupiah.
    - Ids are UUIDs. List endpoints page with `cursor` and `limit`.

    Extensions used by the server:

    - `x-permission`: the permission a user needs (any outlet) to call the operation. Checked
      by middleware before the handler runs. Operations that name an outlet check it again
      for that outlet.

    The spec is OpenAPI 3.0.3 rather than 3.1 because the code generator supports it fully.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /

tags:
  - name: auth
    description: Sign in, sessions and email verification
  - name: tenancy
    description: The signed-in business and its outlets
  - name: staff
    description: People who work in the business, their roles and PINs
  - name: devices
    description: Pairing POS tablets and what they download
  - name: catalog
    description: What the business sells - categories, items, variants, modifiers and per-outlet prices
  - name: reports
    description: End-of-shift and end-of-day reports
  - name: sync
    description: The device's offline-first sync with the server
  - name: entitlements
    description: What the business's plan allows
  - name: admin
    description: Operator (Orion staff) sign-in and audit log. Needs ORION_PLATFORM_DATABASE_URL on the server.

security:
  - userAuth: []

paths:
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Returns an access token (15 minutes) and a refresh token (30 days, single use). An account
        that belongs to several businesses must say which with `tenant_id`; without it the
        response is `409 tenant_required` listing the choices.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new session
      description: |
        Every refresh token works once. Presenting one a second time revokes the whole session
        (`token_reused`) and the user must sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End a session
      description: Revokes the session the refresh token belongs to. Always succeeds, so it can be retried.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out
        '400': {$ref: '#/components/responses/ValidationFailed'}

  /v1/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a business, its first outlet and its owner
      description: |
        The public sign-up form. In one transaction it creates the business (on the early access
        plan), its roles, its first outlet and its owner, and queues the verification email. The
        owner cannot sign in until the address is verified (`POST /v1/auth/verify-email`).

        **Always answers 202 with no body**, whether the business was created or the email address
        already has an account, so the form cannot be used to find out who is registered. In the
        second case nothing is created and the existing account's owner is emailed instead (a
        verification link again if the address was never verified, otherwise a notice pointing at
        sign-in). The caller can only say "if the address is usable, you will get an email".

        `website` is a honeypot: a real form leaves it empty (hide it from people); a request that
        fills it is accepted and ignored. Sign-ups are rate limited by caller address and by email
        address (`429 rate_limited`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Accepted. Check your email.
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Verified
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Send the verification email again
      description: |
        Always answers 202, whether or not the address has an account, so it cannot be used to
        find out who is registered. Repeats within five minutes are dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Accepted
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/me:
    get:
      operationId: getMe
      tags: [tenancy]
      summary: The signed-in user and their business
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/outlets:
    get:
      operationId: listOutlets
      tags: [tenancy]
      summary: The business's outlets with their settings
      responses:
        '200':
          description: Active outlets, ordered by code
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outlet'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/outlets/{outletId}:
    get:
      operationId: getOutlet
      tags: [tenancy]
      summary: One outlet with its settings
      parameters:
        - $ref: '#/components/parameters/OutletId'
      responses:
        '200':
          description: The outlet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/outlets/{outletId}/settings:
    patch:
      operationId: updateOutletSettings
      tags: [tenancy]
      summary: Change an outlet's tax, service charge, rounding, time and receipt settings
      description: |
        Fields left out stay as they are. Needs `settings.manage` at that outlet. The change reaches
        the outlet's devices at their next sync and is written to the audit log with the old and new
        values. Sales already recorded keep the amounts they were calculated with and their
        business date.
      x-permission: settings.manage
      parameters:
        - $ref: '#/components/parameters/OutletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutletSettingsUpdate'
      responses:
        '200':
          description: The outlet with its settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outlet'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/reports/shifts/{shiftId}:
    get:
      operationId: getShiftReport
      tags: [reports]
      summary: End-of-shift report
      description: |
        What one shift took and how its drawer reconciles. Computed live from the recorded sales, so
        it is always current; a void made later of one of the shift's sales removes it from the
        totals.

        **Expected cash** is the opening cash, plus the cash applied to the bills of the shift's
        sales (net of change, whatever became of the sale later), minus the cash refunded for voids
        made *in this shift* (of any shift's sales), plus pay ins, minus pay outs. `difference` is
        `counted - expected`: negative means the drawer is short. Both are absent while the shift is
        open.

        Needs `report.view` at the shift's outlet.
      x-permission: report.view
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftReport'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/reports/days/{date}:
    get:
      operationId: getDayReport
      tags: [reports]
      summary: End-of-day report for an outlet
      description: |
        The business day `date` (in the outlet's time zone and day cutoff) at one outlet: completed
        sales by the business date they were rung up on, what each payment method took, voids, manual
        discounts, cash movements, the shifts opened that day with their cash reconciliation, and the
        review flags raised by that day's events. The numbers are those on the receipts: a sale is
        stored as the device charged it. Needs `report.view` at the outlet.
      x-permission: report.view
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
        - name: outlet_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayReport'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sales:
    get:
      operationId: listSales
      tags: [reports]
      summary: Sales, newest first
      description: |
        Sales as the devices recorded them, newest business day first and newest sale first within a
        day, a page at a time. Each carries its payments and the codes of its review flags. Without
        `outlet_id` the list covers every outlet where the caller has `report.view`. Read-only.
      x-permission: report.view
      parameters:
        - name: outlet_id
          in: query
          schema: {type: string, format: uuid}
        - name: from
          in: query
          description: First business date, inclusive.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Last business date, inclusive.
          schema: {type: string, format: date}
        - name: status
          in: query
          schema: {type: string, enum: [completed, voided]}
        - name: receipt_number
          in: query
          description: Exact receipt number.
          schema: {type: string, maxLength: 40}
        - name: staff_id
          in: query
          schema: {type: string, format: uuid}
        - name: flagged
          in: query
          description: Only sales with review flags, on the sale or its void.
          schema: {type: boolean, default: false}
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Opaque.
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sales/{saleId}:
    get:
      operationId: getSale
      tags: [reports]
      summary: One sale with everything recorded about it
      description: |
        The lines with their modifiers, discounts, payments, the void if there is one, the review flags
        with their detail, and the calculation settings the device used. Needs `report.view` at the
        sale's outlet.
      x-permission: report.view
      parameters:
        - name: saleId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/roles:
    get:
      operationId: listRoles
      tags: [staff]
      summary: The business's roles with their permissions
      description: Owner, Manager, Cashier and Kitchen exist for every business. They cannot be edited.
      x-permission: staff.manage
      responses:
        '200':
          description: Roles, system roles first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: Staff, a page at a time
      x-permission: staff.manage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of staff ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createStaff
      tags: [staff]
      summary: Add a staff member
      description: |
        The caller needs `staff.manage` at every outlet in `outlet_roles` and can only grant roles
        whose permissions they hold at that outlet themselves.
      x-permission: staff.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaff'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/staff/{staffId}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Rename, deactivate or reassign a staff member
      description: |
        Fields left out stay as they are. `outlet_roles`, when present, replaces the whole
        assignment. Only an owner can change an owner.
      x-permission: staff.manage
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: The updated staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/staff/{staffId}/pin:
    put:
      operationId: setStaffPin
      tags: [staff]
      summary: Set or rotate a staff member's PIN
      description: |
        4 to 6 digits, not all the same and not a run like 1234. The PIN is stored as an argon2id
        hash and reaches paired devices at their next sync. A PIN switches who is recorded as
        acting on a device; it is not a security boundary.
      x-permission: staff.manage
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
      responses:
        '204':
          description: PIN set
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: Paired devices, a page at a time
      description: Owners see every device; others only those at outlets where they can manage devices.
      x-permission: device.manage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of devices ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/devices/pair:
    post:
      operationId: pairDevice
      tags: [devices]
      summary: Pair a tablet with an outlet
      description: |
        The owner or manager signs in on the tablet, picks an outlet and calls this. The response
        carries the device secret **once**; the server keeps only a hash, so a lost secret means
        pairing again. The device code (the middle of receipt numbers) is never reused.
      x-permission: device.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDevice'
      responses:
        '201':
          description: Paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairedDevice'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/devices/token:
    post:
      operationId: exchangeDeviceToken
      tags: [devices]
      summary: Trade a device secret for an access token
      description: |
        Device access tokens last 30 minutes. A revoked device is refused here with
        `device_revoked`, which is how revocation reaches a tablet that comes back online.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: A device access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSession'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device
      description: |
        Its next token exchange fails and requests with a token it already holds fail at once.
        Revoking twice is not an error. The device code is not reused.
      x-permission: device.manage
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Revoked
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/pos/roster:
    get:
      operationId: getRoster
      tags: [devices]
      summary: What a paired device needs to start working
      description: |
        The device's own record, its outlet and settings, and the active staff who work there with
        their PIN hashes and permissions, so the tablet can check PINs and enforce permissions
        offline. PIN hashes are argon2id PHC strings. This is a convenience switch, not a security
        boundary (docs/BACKEND_PLAN.md section 4.3).
      security:
        - deviceAuth: []
      responses:
        '200':
          description: The roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roster'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/sync/push:
    post:
      operationId: pushEvents
      tags: [sync]
      summary: Push the device's events to the server
      description: |
        The device sends what happened since its last push, oldest first. Each event is applied in
        its own transaction, exactly once: pushing the same event again returns `duplicate` and
        changes nothing, so a lost response is harmless. The same `idempotency_key` with different
        content is rejected as `idempotency_conflict`.

        One result per event, in order:

        - `accepted`: stored. With `code: pending_dependency` the event is parked until the record
          it refers to arrives (a void ahead of its sale); the device should treat it as delivered.
        - `duplicate`: already accepted earlier; nothing was applied again.
        - `rejected`: malformed; it will never be applied. Keep it for support and do not resend
          (`unknown_type`, `unsupported_schema_version`, `unknown_staff`, `wrong_outlet`,
          `malformed`, `unknown_reference`, `invalid_value`, `idempotency_conflict`, `id_conflict`,
          `device_revoked`, and codes of the event type's own validation).
        - `retry`: the server failed to process it; nothing was recorded. Send it again later.

        Only malformed events are rejected. A sale with odd totals, or made by someone without the
        permission, is accepted and flagged for review, because the money has already moved.

        At most 500 events and 1 MB per push; page through the outbox. A revoked device gets
        `403 device_revoked` and nothing is accepted.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: One result per event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/sync/pull:
    get:
      operationId: pullChanges
      tags: [sync]
      summary: Pull what changed since the device's cursor
      description: |
        Returns the **current state** of every entity that changed since `cursor`, for the device's
        outlet: catalog entities (items with their variants and modifier group links, categories,
        modifier groups, this outlet's price overrides and availability; archived ones included and
        marked), the outlet and its settings, the roster entries with PIN hashes and permissions, and
        the entitlements snapshot with its `expires_at`.

        Store the returned `cursor` only after applying the response, and send it next time. While
        `has_more` is true ask again straight away. With no cursor, an unreadable one, or one ahead
        of the server (a restored database), the response is a **snapshot** (`snapshot: true`): the
        whole state, which replaces the device's copy instead of merging into it.

        Entitlements ride on every pull. The device applies new ones at its next sync and never in
        the middle of a shift.
      security:
        - deviceAuth: []
      parameters:
        - name: cursor
          in: query
          description: The `cursor` of the previous response. Opaque. Leave out for a full snapshot.
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          description: At most this many changes are turned into entities per response.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
        - name: client_time
          in: query
          description: The device's clock now, so the server can record how far off it is.
          schema: {type: string, format: date-time}
        - name: app_version
          in: query
          schema: {type: string, maxLength: 40}
        - name: unsynced_events
          in: query
          description: How many events are in the device's outbox, as on a push.
          schema: {type: integer, minimum: 0}
        - name: oldest_unsynced_at
          in: query
          description: Device time of the oldest of them; needed when `unsynced_events` is above 0.
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: The changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      summary: Modules, limits and flags that apply to the business
      description: |
        Resolved as tenant override (unless expired), then plan, then default. A module that is off
        answers its endpoints with `403 module_disabled`; a limit that would be exceeded answers
        creation with `403 limit_reached`. Cached for up to 30 seconds.
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/pos/receipt-test:
    get:
      operationId: getReceiptTest
      tags: [devices]
      summary: A sample receipt priced with the outlet's real settings
      description: |
        For the POS hardware spike: the outlet's header and footer, and a made-up sale priced with
        its tax, service charge and cash rounding, numbered with the device's code. It is a preview
        of the bill calculation in docs/BACKEND_PLAN.md section 4.8, without discounts; real sales
        arrive in Phase 1. Money is integer rupiah.
      security:
        - deviceAuth: []
      responses:
        '200':
          description: The sample receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptTest'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: Categories, a page at a time
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: A page of categories ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCategory
      tags: [catalog]
      summary: Add a category
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [catalog]
      summary: Rename, reorder, archive or restore a category
      description: Fields left out stay as they are. A category is archived, never deleted.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: The updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/items:
    get:
      operationId: listItems
      tags: [catalog]
      summary: Items with their variants, a page at a time
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: category_id
          in: query
          description: Only items in this category.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A page of items ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createItem
      tags: [catalog]
      summary: Add an item with its variants
      description: |
        An item is sold through its variants, so at least one is required (a one-size item has one
        variant with no name). `modifier_group_ids` lists the groups offered with the item, in
        display order.
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/items/{itemId}:
    get:
      operationId: getItem
      tags: [catalog]
      summary: One item with its variants and modifier groups
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The item, archived or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateItem
      tags: [catalog]
      summary: Change, archive or restore an item
      description: |
        Fields left out stay as they are. A blank `sku`, `barcode` or `image_url` clears it; to
        remove the category send `clear_category: true`. `modifier_group_ids`, when present,
        replaces the item's groups. Prices change on variants, not here.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/items/{itemId}/variants:
    post:
      operationId: addVariant
      tags: [catalog]
      summary: Add a variant to an item
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVariant'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/variants/{variantId}:
    patch:
      operationId: updateVariant
      tags: [catalog]
      summary: Change a variant's name, codes, price or order, or archive it
      description: |
        Fields left out stay as they are; a blank `sku` or `barcode` clears it. A changed
        `base_price` is written to the audit log. Archived variants free their SKU and barcode.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantUpdate'
      responses:
        '200':
          description: The updated variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/modifier-groups:
    get:
      operationId: listModifierGroups
      tags: [catalog]
      summary: Modifier groups with their modifiers, a page at a time
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: A page of groups ordered by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierGroupPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createModifierGroup
      tags: [catalog]
      summary: Add a modifier group with its first modifiers
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModifierGroup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierGroup'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/modifier-groups/{groupId}:
    patch:
      operationId: updateModifierGroup
      tags: [catalog]
      summary: Change or archive a modifier group
      description: The selection rules are checked on the result, so changing `required` alone fails when `min_select` is 0.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierGroupUpdate'
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierGroup'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/modifier-groups/{groupId}/modifiers:
    post:
      operationId: addModifier
      tags: [catalog]
      summary: Add a modifier to a group
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewModifier'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modifier'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/modifiers/{modifierId}:
    patch:
      operationId: updateModifier
      tags: [catalog]
      summary: Change or archive a modifier
      description: A changed `price_delta` is written to the audit log.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/ModifierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierUpdate'
      responses:
        '200':
          description: The updated modifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modifier'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/outlets/{outletId}/variants:
    get:
      operationId: listOutletVariants
      tags: [catalog]
      summary: Price overrides and availability at one outlet
      description: |
        Lists the variants that have a setting at this outlet. Variants not listed are available
        at their base price. Needs `catalog.manage` at that outlet.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/OutletId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page ordered by variant id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletVariantPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/outlets/{outletId}/variants/{variantId}:
    put:
      operationId: setOutletVariant
      tags: [catalog]
      summary: Set a variant's price and availability at one outlet
      description: |
        Replaces the setting: a null or missing `price_override` means the base price. Only that
        outlet's devices receive the change. A changed price is written to the audit log. Needs
        `catalog.manage` at that outlet.
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/OutletId'
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutletVariantSetting'
      responses:
        '200':
          description: The setting now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletVariant'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Operator password step
      description: |
        Returns a challenge token valid for 5 minutes. It is not a session: exchange it with a TOTP
        or recovery code at `/admin/auth/totp/verify`. Unknown operators and wrong passwords look
        the same.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Password accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorChallenge'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/auth/totp/verify:
    post:
      operationId: adminVerifyTotp
      tags: [admin]
      summary: Operator second step
      description: |
        A TOTP code works once; so does each recovery code. The first successful code confirms
        enrolment. The session lasts one hour; there is no refresh, sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorVerifyRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /admin/audit-log:
    get:
      operationId: adminListAuditLog
      tags: [admin]
      summary: Platform audit log, newest first
      security:
        - operatorAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries; `next_cursor` leads to older ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of an owner or manager (audience `tenant`), from `POST /v1/auth/login`.
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Operator session token (audience `operator`), from `/admin/auth/totp/verify`.
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of a paired device (audience `device`), from `POST /v1/devices/token`.

  parameters:
    OutletId:
      name: outletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Leave out for the first page.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VariantId:
      name: variantId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModifierId:
      name: modifierId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IncludeArchived:
      name: include_archived
      in: query
      description: Also list archived entries.
      schema: {type: boolean, default: false}

  responses:
    ValidationFailed:
      description: The request is malformed or breaks a rule (`validation_failed`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid or expired credentials (`invalid_credentials`, `invalid_token`, `token_reused`).
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated but not allowed (`forbidden`, `email_not_verified`, `no_tenant`, `tenant_suspended`, `device_revoked`, `module_disabled`, `limit_reached`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: No such resource in this business (`not_found`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: The request conflicts with current state (`conflict`, `tenant_required`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: The operator console is not enabled on this server (`admin_disabled`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit hit (`rate_limited`). Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI naming the problem type; `about:blank` when `code` says it all.
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable, language-neutral code. Clients switch on this.
          example: validation_failed
        detail:
          type: string
          description: Human-readable explanation. Not stable; do not parse it.
        request_id:
          type: string
        tenant_ids:
          type: array
          description: With `tenant_required`, the businesses the account can sign in to.
          items: {type: string, format: uuid}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, maxLength: 256}
        tenant_id:
          type: string
          format: uuid
          description: Which business to sign in to, for accounts that belong to several.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, maxLength: 512}

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 512}

    SignupRequest:
      type: object
      required: [business_name, owner_name, email, password]
      properties:
        business_name: {type: string, maxLength: 120, example: Kopi Senja}
        owner_name: {type: string, maxLength: 60, description: The owner's own name, shown in the staff list., example: Sari}
        email: {type: string, maxLength: 254}
        password: {type: string, minLength: 10, maxLength: 128}
        outlet_name:
          type: string
          maxLength: 120
          description: The first outlet. Defaults to the business name.
        outlet_code:
          type: string
          pattern: '^[A-Za-z0-9]{2,6}$'
          description: |
            Prefix of this outlet's receipt numbers (`KOPI1-01-000001`); cannot be changed later.
            Defaults to up to four letters from the outlet name followed by 1.
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
          description: Defaults to Asia/Jakarta.
        locale:
          type: string
          enum: [id-ID, en]
          description: The language of emails to the owner. Defaults to id-ID.
        website:
          type: string
          maxLength: 200
          description: Honeypot. Leave empty and hide it from people.

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254}

    Session:
      type: object
      required: [token_type, access_token, access_expires_at, refresh_token, refresh_expires_at, tenant_id, user_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time}
        tenant_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}

    User:
      type: object
      required: [id, email, email_verified, locale]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        email_verified: {type: boolean}
        locale: {type: string, enum: [id-ID, en]}

    TenantSummary:
      type: object
      required: [id, name, slug, subscription_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        subscription_status:
          type: string
          enum: [early_access, trialing, active, past_due, grace, read_only, canceled]

    Me:
      type: object
      required: [user, tenant, is_owner, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tenant: {$ref: '#/components/schemas/TenantSummary'}
        is_owner: {type: boolean}
        permissions:
          type: array
          description: Every permission the user holds at any outlet. An owner holds all of them.
          items: {type: string, example: staff.manage}

    Role:
      type: object
      required: [id, name, is_system, permissions]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_system: {type: boolean}
        permissions:
          type: array
          items: {type: string, example: sale.void}

    OutletRole:
      type: object
      required: [outlet_id, role_id]
      properties:
        outlet_id: {type: string, format: uuid}
        role_id: {type: string, format: uuid}

    Staff:
      type: object
      required: [id, display_name, active, has_pin, is_owner, outlet_roles, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the person also signs in by email.
        display_name: {type: string, maxLength: 60}
        active: {type: boolean}
        has_pin: {type: boolean}
        pin_rotated_at: {type: string, format: date-time, nullable: true}
        is_owner: {type: boolean}
        outlet_roles:
          type: array
          items: {$ref: '#/components/schemas/OutletRole'}
        created_at: {type: string, format: date-time}

    StaffPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Staff'}
        next_cursor:
          type: string
          format: uuid
          description: Pass as `cursor` for the next page; absent on the last page.

    NewStaff:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string, maxLength: 60}
        outlet_roles:
          type: array
          items: {$ref: '#/components/schemas/OutletRole'}
        pin:
          type: string
          description: Optional; can be set later with `PUT /v1/staff/{staffId}/pin`.

    StaffUpdate:
      type: object
      properties:
        display_name: {type: string, maxLength: 60}
        active: {type: boolean}
        outlet_roles:
          type: array
          items: {$ref: '#/components/schemas/OutletRole'}

    SetPinRequest:
      type: object
      required: [pin]
      properties:
        pin: {type: string, minLength: 4, maxLength: 6}

    OutletSettings:
      type: object
      required: [timezone, business_day_cutoff, price_includes_tax, tax_rate_bp, service_charge_rate_bp, service_charge_taxable, cash_rounding_unit, cash_rounding_mode, receipt_header, receipt_footer]
      properties:
        timezone: {type: string, enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]}
        business_day_cutoff:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '04:00'
          description: |
            When the business day begins, as a time of day in the outlet's time zone, 00:00 to 11:59.
            A sale before it counts towards the previous day.
        price_includes_tax: {type: boolean}
        tax_rate_bp: {type: integer, minimum: 0, maximum: 10000, description: Basis points; 1100 is 11%.}
        service_charge_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        service_charge_taxable: {type: boolean}
        cash_rounding_unit: {type: integer, minimum: 0, description: Rupiah; 0 means no rounding.}
        cash_rounding_mode: {type: string, enum: [nearest, down, up]}
        receipt_header: {type: string}
        receipt_footer: {type: string}

    OutletSettingsUpdate:
      type: object
      properties:
        timezone: {type: string, enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]}
        business_day_cutoff: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '04:00'}
        price_includes_tax: {type: boolean}
        tax_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        service_charge_rate_bp: {type: integer, minimum: 0, maximum: 10000}
        service_charge_taxable: {type: boolean}
        cash_rounding_unit: {type: integer, minimum: 0, maximum: 10000}
        cash_rounding_mode: {type: string, enum: [nearest, down, up]}
        receipt_header: {type: string, maxLength: 500}
        receipt_footer: {type: string, maxLength: 500}

    Outlet:
      type: object
      required: [id, code, name, address, settings]
      properties:
        id: {type: string, format: uuid}
        code:
          type: string
          description: Two to six uppercase letters or digits; the prefix of receipt numbers.
        name: {type: string}
        address: {type: string}
        settings: {$ref: '#/components/schemas/OutletSettings'}

    Device:
      type: object
      required: [id, outlet_id, device_code, name, paired_by, paired_at, unsynced_events]
      properties:
        id: {type: string, format: uuid}
        outlet_id: {type: string, format: uuid}
        device_code:
          type: integer
          minimum: 1
          description: The middle of receipt numbers, `{outlet_code}-{device_code}-{counter}`; shown with at least two digits. Unique per outlet and never reused.
        name: {type: string}
        paired_by: {type: string, format: uuid}
        paired_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
        last_sync_at: {type: string, format: date-time, nullable: true}
        app_version: {type: string, nullable: true}
        clock_skew_ms:
          type: integer
          nullable: true
          description: Server time minus device time. Positive means the device clock is behind.
        unsynced_events:
          type: integer
          description: How many events the device said were still in its outbox when it last reported.
        oldest_unsynced_at: {type: string, format: date-time, nullable: true}
        health_reported_at: {type: string, format: date-time, nullable: true}

    DevicePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Device'}
        next_cursor: {type: string, format: uuid}

    NewDevice:
      type: object
      required: [outlet_id, name]
      properties:
        outlet_id: {type: string, format: uuid}
        name: {type: string, maxLength: 60, example: Kasir 1}

    PairedDevice:
      type: object
      required: [device, device_secret]
      properties:
        device: {$ref: '#/components/schemas/Device'}
        device_secret:
          type: string
          description: Shown once. Store it on the device; the server keeps only a hash.

    DeviceTokenRequest:
      type: object
      required: [device_secret]
      properties:
        device_secret: {type: string, maxLength: 512}
        app_version: {type: string, maxLength: 40}
        client_time:
          type: string
          format: date-time
          description: The device's clock, so the server can record how far off it is.

    DeviceSession:
      type: object
      required: [token_type, access_token, access_expires_at, device_id, outlet_id, tenant_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        device_id: {type: string, format: uuid}
        outlet_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}

    RosterStaff:
      type: object
      required: [id, display_name, permissions]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        pin_hash:
          type: string
          nullable: true
          description: argon2id in PHC format; null if the person has no PIN yet.
        permissions:
          type: array
          description: What the person may do at this outlet.
          items: {type: string, example: sale.void}

    Roster:
      type: object
      required: [device, outlet, staff, generated_at]
      properties:
        device: {$ref: '#/components/schemas/Device'}
        outlet: {$ref: '#/components/schemas/Outlet'}
        staff:
          type: array
          items: {$ref: '#/components/schemas/RosterStaff'}
        generated_at: {type: string, format: date-time}

    Entitlement:
      type: object
      required: [key, kind, category, value, source]
      properties:
        key: {type: string, example: limit.devices}
        kind: {type: string, enum: [bool, int]}
        category: {type: string, enum: [module, limit, flag]}
        value:
          type: integer
          format: int64
          description: 0 or 1 for a bool; a count for a limit, or -1 for unlimited.
        source: {type: string, enum: [default, plan, override]}

    Entitlements:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Entitlement'}
        generated_at: {type: string, format: date-time}

    ReceiptTest:
      type: object
      required: [outlet, header, footer, receipt_number, printed_at, lines, subtotal, service_charge, tax, tax_included, total, rounding_amount, cash_total, pricing_version]
      properties:
        outlet:
          type: object
          required: [code, name, address, timezone]
          properties:
            code: {type: string}
            name: {type: string}
            address: {type: string}
            timezone: {type: string}
        header: {type: string}
        footer: {type: string}
        receipt_number:
          type: string
          example: JKT1-01-000001
          description: "`{outlet_code}-{device_code:02d}-{counter:06d}`; the counter is always 1 here."
        printed_at: {type: string, format: date-time}
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, unit_price, amount]
            properties:
              name: {type: string}
              quantity: {type: integer}
              unit_price: {type: integer, format: int64}
              amount: {type: integer, format: int64}
        subtotal: {type: integer, format: int64}
        service_charge: {type: integer, format: int64}
        tax: {type: integer, format: int64}
        tax_included:
          type: boolean
          description: True when prices already include the tax, so it is shown but not added to the total.
        total: {type: integer, format: int64}
        rounding_amount:
          type: integer
          format: int64
          description: Cash rounding, applied to a cash tender only.
        cash_total: {type: integer, format: int64, description: total plus rounding_amount}
        pricing_version: {type: string, example: sample-0}

    Category:
      type: object
      required: [id, name, sort_order, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 60}
        sort_order: {type: integer}
        archived_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    CategoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Category'}
        next_cursor: {type: string, format: uuid}

    NewCategory:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60}
        sort_order: {type: integer, default: 0}

    CategoryUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 60}
        sort_order: {type: integer}
        archived: {type: boolean, description: true archives, false restores.}

    Variant:
      type: object
      required: [id, item_id, name, base_price, sort_order]
      properties:
        id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        name: {type: string, maxLength: 60, description: Empty for a one-size item.}
        sku: {type: string, nullable: true, maxLength: 40}
        barcode: {type: string, nullable: true, maxLength: 40}
        base_price: {type: integer, format: int64, minimum: 0, maximum: 1000000000, description: Rupiah.}
        sort_order: {type: integer}
        archived_at: {type: string, format: date-time, nullable: true}

    NewVariant:
      type: object
      required: [base_price]
      properties:
        name: {type: string, maxLength: 60, default: ''}
        sku: {type: string, maxLength: 40}
        barcode: {type: string, maxLength: 40}
        base_price: {type: integer, format: int64, minimum: 0, maximum: 1000000000, description: Rupiah.}

    VariantUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 60}
        sku: {type: string, maxLength: 40, description: Blank clears it.}
        barcode: {type: string, maxLength: 40, description: Blank clears it.}
        base_price: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        sort_order: {type: integer}
        archived: {type: boolean, description: true archives, false restores.}

    Item:
      type: object
      required: [id, name, track_stock, variants, modifier_group_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid, nullable: true}
        name: {type: string, maxLength: 120}
        sku: {type: string, nullable: true, maxLength: 40}
        barcode: {type: string, nullable: true, maxLength: 40}
        image_url: {type: string, nullable: true, maxLength: 500}
        track_stock: {type: boolean}
        archived_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        variants:
          type: array
          description: Including archived ones, ordered by `sort_order`.
          items: {$ref: '#/components/schemas/Variant'}
        modifier_group_ids:
          type: array
          description: In display order.
          items: {type: string, format: uuid}

    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Item'}
        next_cursor: {type: string, format: uuid}

    NewItem:
      type: object
      required: [name, variants]
      properties:
        name: {type: string, maxLength: 120}
        category_id: {type: string, format: uuid}
        sku: {type: string, maxLength: 40}
        barcode: {type: string, maxLength: 40}
        image_url: {type: string, maxLength: 500}
        track_stock: {type: boolean, default: false}
        variants:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/NewVariant'}
        modifier_group_ids:
          type: array
          maxItems: 20
          items: {type: string, format: uuid}

    ItemUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        category_id: {type: string, format: uuid}
        clear_category: {type: boolean, description: Remove the item from its category. Not combinable with category_id.}
        sku: {type: string, maxLength: 40, description: Blank clears it.}
        barcode: {type: string, maxLength: 40, description: Blank clears it.}
        image_url: {type: string, maxLength: 500, description: Blank clears it.}
        track_stock: {type: boolean}
        archived: {type: boolean, description: true archives, false restores.}
        modifier_group_ids:
          type: array
          maxItems: 20
          description: Replaces the item's groups, in this order.
          items: {type: string, format: uuid}

    Modifier:
      type: object
      required: [id, group_id, name, price_delta, sort_order]
      properties:
        id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        name: {type: string, maxLength: 60}
        price_delta: {type: integer, format: int64, minimum: -1000000000, maximum: 1000000000, description: Rupiah added to the line price; may be negative.}
        sort_order: {type: integer}
        archived_at: {type: string, format: date-time, nullable: true}

    NewModifier:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60}
        price_delta: {type: integer, format: int64, minimum: -1000000000, maximum: 1000000000, default: 0}

    ModifierUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 60}
        price_delta: {type: integer, format: int64, minimum: -1000000000, maximum: 1000000000}
        sort_order: {type: integer}
        archived: {type: boolean, description: true archives, false restores.}

    ModifierGroup:
      type: object
      required: [id, name, min_select, max_select, required, modifiers, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 60}
        min_select: {type: integer, minimum: 0}
        max_select: {type: integer, minimum: 1, maximum: 100}
        required: {type: boolean, description: A required group needs `min_select` of at least 1.}
        archived_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        modifiers:
          type: array
          items: {$ref: '#/components/schemas/Modifier'}

    ModifierGroupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModifierGroup'}
        next_cursor: {type: string, format: uuid}

    NewModifierGroup:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60}
        min_select: {type: integer, minimum: 0, default: 0}
        max_select: {type: integer, minimum: 1, maximum: 100, default: 1}
        required: {type: boolean, default: false}
        modifiers:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/NewModifier'}

    ModifierGroupUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 60}
        min_select: {type: integer, minimum: 0}
        max_select: {type: integer, minimum: 1, maximum: 100}
        required: {type: boolean}
        archived: {type: boolean, description: true archives, false restores.}

    OutletVariant:
      type: object
      required: [outlet_id, variant_id, available]
      properties:
        outlet_id: {type: string, format: uuid}
        variant_id: {type: string, format: uuid}
        price_override: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000, description: Rupiah; null means the base price.}
        available: {type: boolean}

    OutletVariantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OutletVariant'}
        next_cursor: {type: string, format: uuid}

    OutletVariantSetting:
      type: object
      required: [available]
      properties:
        price_override: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000}
        available: {type: boolean}

    SyncEvent:
      type: object
      required: [id, idempotency_key, type, staff_id, device_time, schema_version, payload]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7. For a create event it is the id of the record created.
        idempotency_key:
          type: string
          format: uuid
          description: Equal to `id` for create events.
        type:
          type: string
          example: sale.completed
          description: One of `shift.opened`, `shift.closed`, `cash.movement`, `sale.completed`, `sale.voided`.
        staff_id:
          type: string
          format: uuid
          description: Who performed the action on the device.
        device_time:
          type: string
          format: date-time
          description: When it happened, by the device's clock.
        schema_version: {type: integer, minimum: 1}
        payload:
          type: object
          additionalProperties: true
          description: Depends on `type`. Kept exactly as sent.
          x-go-type: json.RawMessage

    PushRequest:
      type: object
      required: [device_id, events]
      properties:
        device_id:
          type: string
          format: uuid
          description: Must be the device the token belongs to.
        client_time:
          type: string
          format: date-time
          description: The device's clock when it sent this, so the server can record how far off it is.
        app_version: {type: string, maxLength: 40}
        unsynced_events:
          type: integer
          minimum: 0
          description: How many events are still in the device's outbox after this push. The server alerts the owner when events stay unsynced for too long.
        oldest_unsynced_at:
          type: string
          format: date-time
          description: Device time of the oldest event still in the outbox; needed when `unsynced_events` is above 0.
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/SyncEvent'}

    SyncResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, duplicate, rejected, retry]}
        code: {type: string, description: Why, for `rejected` and `retry`, or `pending_dependency` for a parked event.}
        detail: {type: string, description: Human-readable; not stable.}

    PushResponse:
      type: object
      required: [results, server_time]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/SyncResult'}
        server_time: {type: string, format: date-time}

    PullResponse:
      type: object
      required: [cursor, snapshot, has_more, server_time, categories, items, modifier_groups, outlet_variants, staff, removed_staff_ids, deleted, entitlements]
      properties:
        cursor: {type: string, description: Send as `cursor` next time, after applying this response.}
        snapshot: {type: boolean, description: This is the whole state; replace the local copy.}
        has_more: {type: boolean, description: More changes are waiting; pull again now.}
        server_time: {type: string, format: date-time}
        outlet:
          allOf:
            - $ref: '#/components/schemas/Outlet'
          description: Present when the outlet or its settings changed, and in a snapshot.
        categories:
          type: array
          items: {$ref: '#/components/schemas/Category'}
        items:
          type: array
          description: Each with its variants and modifier group ids.
          items: {$ref: '#/components/schemas/Item'}
        modifier_groups:
          type: array
          description: Each with its modifiers.
          items: {$ref: '#/components/schemas/ModifierGroup'}
        outlet_variants:
          type: array
          description: This outlet's price overrides and availability. A variant not listed (in a snapshot) is at its base price and available.
          items: {$ref: '#/components/schemas/OutletVariant'}
        staff:
          type: array
          description: Roster entries that changed.
          items: {$ref: '#/components/schemas/RosterStaff'}
        removed_staff_ids:
          type: array
          description: People who changed and are no longer on this outlet's roster.
          items: {type: string, format: uuid}
        deleted:
          type: array
          description: Entities removed outright. Empty in Phase 1; the catalog is archived, not deleted.
          items:
            type: object
            required: [type, id]
            properties:
              type: {type: string}
              id: {type: string, format: uuid}
        entitlements:
          type: object
          required: [items, generated_at, expires_at]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Entitlement'}
            generated_at: {type: string, format: date-time}
            expires_at:
              type: string
              format: date-time
              description: Keep applying these until then if the server cannot be reached.

    ReportCash:
      type: object
      required: [opening_cash, received, refunded, pay_in, pay_out, expected]
      properties:
        opening_cash: {type: integer, format: int64}
        received: {type: integer, format: int64, description: Cash applied to the bills of the shift's sales, net of change.}
        refunded: {type: integer, format: int64, description: Cash returned for voids made in the shift.}
        pay_in: {type: integer, format: int64}
        pay_out: {type: integer, format: int64}
        expected: {type: integer, format: int64, description: opening_cash + received - refunded + pay_in - pay_out}
        counted: {type: integer, format: int64, nullable: true, description: Absent until the shift is closed.}
        difference: {type: integer, format: int64, nullable: true, description: counted - expected; negative means short.}

    ReportTotals:
      type: object
      required: [count, subtotal, discounts, net, service_charge, tax, total, rounding]
      properties:
        count: {type: integer, format: int64, description: Completed sales.}
        subtotal: {type: integer, format: int64, description: Before discounts.}
        discounts: {type: integer, format: int64}
        net: {type: integer, format: int64, description: subtotal - discounts}
        service_charge: {type: integer, format: int64}
        tax: {type: integer, format: int64}
        total: {type: integer, format: int64, description: What the bills came to, before cash rounding.}
        rounding: {type: integer, format: int64, description: Cash rounding, positive or negative.}

    ReportMethod:
      type: object
      required: [method, payments, amount]
      properties:
        method: {type: string, enum: [cash, qris_manual, qris_dynamic, ewallet, card_manual]}
        payments: {type: integer, format: int64}
        amount: {type: integer, format: int64}

    ReportVoided:
      type: object
      required: [count, total]
      properties:
        count: {type: integer, format: int64}
        total: {type: integer, format: int64}

    ReportDiscounts:
      type: object
      required: [count, amount]
      properties:
        count: {type: integer, format: int64}
        amount: {type: integer, format: int64}

    ReportShiftInfo:
      type: object
      required: [id, outlet_id, device_id, opened_by, opened_at, business_date]
      properties:
        id: {type: string, format: uuid}
        outlet_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        opened_by: {type: string, format: uuid}
        opened_at: {type: string, format: date-time}
        business_date: {type: string, format: date}
        closed_by: {type: string, format: uuid, nullable: true}
        closed_at: {type: string, format: date-time, nullable: true}

    ShiftReport:
      type: object
      required: [shift, cash, sales, payment_methods, discounts, voided_sales, voids_recorded, no_sale_openings, flags]
      properties:
        shift: {$ref: '#/components/schemas/ReportShiftInfo'}
        cash: {$ref: '#/components/schemas/ReportCash'}
        sales: {$ref: '#/components/schemas/ReportTotals'}
        payment_methods:
          type: array
          items: {$ref: '#/components/schemas/ReportMethod'}
        discounts: {$ref: '#/components/schemas/ReportDiscounts'}
        voided_sales: {$ref: '#/components/schemas/ReportVoided', description: This shift's sales that were voided, in this shift or later.}
        voids_recorded: {$ref: '#/components/schemas/ReportVoided', description: Voids made during this shift, of any shift's sales.}
        no_sale_openings: {type: integer, format: int64}
        flags: {type: integer, format: int64, description: Review flags raised about the shift and its sales.}

    DayReport:
      type: object
      required: [outlet_id, date, sales, payment_methods, discounts, voided_sales, cash_movements, shifts, open_shifts, cash, flags]
      properties:
        outlet_id: {type: string, format: uuid}
        date: {type: string, format: date}
        sales: {$ref: '#/components/schemas/ReportTotals'}
        payment_methods:
          type: array
          items: {$ref: '#/components/schemas/ReportMethod'}
        discounts: {$ref: '#/components/schemas/ReportDiscounts'}
        voided_sales: {$ref: '#/components/schemas/ReportVoided', description: The day's sales that were voided, whenever the void was made.}
        cash_movements:
          type: object
          required: [pay_in, pay_in_count, pay_out, pay_out_count, no_sale_openings]
          properties:
            pay_in: {type: integer, format: int64}
            pay_in_count: {type: integer, format: int64}
            pay_out: {type: integer, format: int64}
            pay_out_count: {type: integer, format: int64}
            no_sale_openings: {type: integer, format: int64}
        shifts:
          type: array
          description: Shifts opened on this business date, in the order they opened.
          items:
            type: object
            required: [shift, cash]
            properties:
              shift: {$ref: '#/components/schemas/ReportShiftInfo'}
              cash: {$ref: '#/components/schemas/ReportCash'}
        open_shifts: {type: integer}
        cash: {$ref: '#/components/schemas/ReportCash', description: The reconciliation added up over the closed shifts.}
        flags:
          type: object
          description: Review flags raised by the day's events, by code.
          additionalProperties: {type: integer, format: int64}

    SalePayment:
      type: object
      required: [method, amount, status]
      properties:
        method: {type: string, enum: [cash, qris_manual, qris_dynamic, ewallet, card_manual]}
        amount: {type: integer, format: int64, description: Applied to the bill, net of change.}
        tendered: {type: integer, format: int64, nullable: true}
        change: {type: integer, format: int64, nullable: true}
        reference: {type: string}
        status: {type: string, enum: [pending, confirmed, failed]}

    SaleSummary:
      type: object
      required: [id, outlet_id, device_id, shift_id, staff_id, receipt_number, device_time, received_at, business_date, status, subtotal, discount_total, service_charge, tax, tax_included, rounding_amount, total, payments, flag_codes]
      properties:
        id: {type: string, format: uuid}
        outlet_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        staff_id: {type: string, format: uuid}
        receipt_number: {type: string, example: JKT1-03-000482}
        device_time: {type: string, format: date-time, description: When it was rung up, by the device's clock.}
        received_at: {type: string, format: date-time, description: When the server first got it.}
        business_date: {type: string, format: date}
        status: {type: string, enum: [completed, voided]}
        subtotal: {type: integer, format: int64}
        discount_total: {type: integer, format: int64}
        service_charge: {type: integer, format: int64}
        tax: {type: integer, format: int64}
        tax_included: {type: boolean}
        rounding_amount: {type: integer, format: int64}
        total: {type: integer, format: int64, description: Before cash rounding.}
        payments:
          type: array
          items: {$ref: '#/components/schemas/SalePayment'}
        flag_codes:
          type: array
          items: {type: string}

    SalePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SaleSummary'}
        next_cursor: {type: string, description: Pass as `cursor` for the next page; absent on the last page.}

    SaleLine:
      type: object
      required: [line_no, variant_id, name, unit_price, quantity, modifiers, discount, allocated_bill_discount, total]
      properties:
        line_no: {type: integer}
        variant_id: {type: string, format: uuid}
        name: {type: string, description: The name as it was on the receipt.}
        unit_price: {type: integer, format: int64}
        quantity: {type: integer}
        modifiers:
          type: array
          items:
            type: object
            required: [modifier_id, name, price_delta]
            properties:
              modifier_id: {type: string, format: uuid}
              name: {type: string}
              price_delta: {type: integer, format: int64}
        discount: {type: integer, format: int64}
        allocated_bill_discount: {type: integer, format: int64}
        total: {type: integer, format: int64}

    SaleDetail:
      allOf:
        - $ref: '#/components/schemas/SaleSummary'
        - type: object
          required: [pricing_version, pricing, catalog_seq, lines, discounts, flags]
          properties:
            pricing_version: {type: integer}
            pricing:
              type: object
              additionalProperties: true
              description: The calculation settings the device used.
            catalog_seq: {type: integer, format: int64}
            lines:
              type: array
              items: {$ref: '#/components/schemas/SaleLine'}
            discounts:
              type: array
              items:
                type: object
                required: [kind, value, amount, reason]
                properties:
                  line_no: {type: integer, nullable: true, description: Null for a discount on the whole bill.}
                  kind: {type: string, enum: [percent, amount]}
                  value: {type: integer, format: int64}
                  amount: {type: integer, format: int64}
                  reason: {type: string}
                  approved_by: {type: string, format: uuid, nullable: true}
            void:
              type: object
              nullable: true
              required: [id, shift_id, staff_id, reason, device_time, received_at, business_date]
              properties:
                id: {type: string, format: uuid}
                shift_id: {type: string, format: uuid}
                staff_id: {type: string, format: uuid}
                approved_by: {type: string, format: uuid, nullable: true}
                reason: {type: string}
                device_time: {type: string, format: date-time}
                received_at: {type: string, format: date-time}
                business_date: {type: string, format: date}
            flags:
              type: array
              items:
                type: object
                required: [code, target_type, detail, created_at]
                properties:
                  code: {type: string}
                  target_type: {type: string, enum: [sale, void]}
                  detail: {type: object, additionalProperties: true}
                  created_at: {type: string, format: date-time}

    OperatorChallenge:
      type: object
      required: [challenge_token, challenge_expires_at, totp_enrolled]
      properties:
        challenge_token: {type: string}
        challenge_expires_at: {type: string, format: date-time}
        totp_enrolled: {type: boolean, description: False until the first successful code.}

    OperatorVerifyRequest:
      type: object
      required: [challenge_token]
      properties:
        challenge_token: {type: string, maxLength: 1024}
        code: {type: string, maxLength: 12, description: The 6-digit TOTP code.}
        recovery_code: {type: string, maxLength: 40}

    OperatorSession:
      type: object
      required: [token_type, access_token, access_expires_at, operator_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        operator_id: {type: string, format: uuid}

    AuditEntry:
      type: object
      required: [id, action, target_type, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        operator_id: {type: string, format: uuid, nullable: true}
        action: {type: string, example: tenant.suspended}
        target_type: {type: string}
        target_id: {type: string, format: uuid, nullable: true}
        tenant_id: {type: string, format: uuid, nullable: true}
        before: {nullable: true, description: State before the action, as JSON.}
        after: {nullable: true, description: State after the action, as JSON.}
        reason: {type: string}
        ip: {type: string}
        user_agent: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
        next_cursor: {type: string, format: uuid}

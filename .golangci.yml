version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    misspell:
      # "teh" is Indonesian for tea (the demo menu and test business names), not a typo for "the".
      ignore-rules:
        - teh
    gosec:
      excludes:
        - G104 # unchecked errors are errcheck's job
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rezasurin/orion-pos-backend
